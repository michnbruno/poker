<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Endgame Poker — ICM Reference</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ed;
    --surface: #ffffff;
    --surface2: #f0ece5;
    --border: #ddd8cf;
    --text: #1a1714;
    --text2: #5a534a;
    --text3: #8a7f72;
    --accent: #b5451b;
    --accent2: #7a2e10;
    --accent-light: #fdf0eb;
    --green: #2d6a4f;
    --green-light: #e8f5ef;
    --drawer-w: 290px;
    --header-h: 56px;
    --radius: 8px;
    --mono: 'DM Mono', monospace;
    --serif: 'Libre Baskerville', Georgia, serif;
    --sans: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    z-index: 100;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .hamburger {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    margin: -8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }
  .hamburger span {
    display: block;
    width: 22px; height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: all 0.25s ease;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .header-title {
    flex: 1;
    min-width: 0;
  }
  .header-title h1 {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  .header-title p {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-badge {
    background: var(--accent);
    color: white;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .expand-all-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 4px 9px;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .expand-all-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }
  .expand-all-btn.all-expanded {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── OVERLAY ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,23,20,0.45);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay.active { opacity: 1; pointer-events: all; }

  /* ── DRAWER ── */
  .drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--drawer-w);
    background: var(--surface);
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }
  .drawer-header h2 {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  .drawer-header p {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .drawer-nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 24px;
    -webkit-overflow-scrolling: touch;
  }

  /* Chapter group */
  .nav-chapter {
    border-bottom: 1px solid var(--border);
  }
  .nav-chapter:last-child { border-bottom: none; }

  .nav-chapter-btn {
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    text-align: left;
    transition: background 0.15s;
  }
  .nav-chapter-btn:hover { background: var(--surface2); }
  .nav-chapter-btn.active { background: var(--accent-light); }

  .nav-ch-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
    border: 1px solid rgba(181,69,27,0.2);
  }
  .nav-ch-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    line-height: 1.3;
  }
  .nav-ch-arrow {
    font-size: 12px;
    color: var(--text3);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .nav-chapter-btn.expanded .nav-ch-arrow { transform: rotate(90deg); }

  /* Section items */
  .nav-sections {
    display: none;
    background: var(--surface2);
    border-top: 1px solid var(--border);
  }
  .nav-sections.open { display: block; }

  .nav-section-link {
    display: block;
    padding: 9px 18px 9px 40px;
    font-size: 12.5px;
    color: var(--text2);
    text-decoration: none;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    transition: all 0.15s;
    line-height: 1.35;
  }
  .nav-section-link:last-child { border-bottom: none; }
  .nav-section-link:hover {
    background: var(--accent-light);
    color: var(--accent);
    padding-left: 44px;
  }
  .nav-section-link::before {
    content: '›';
    margin-right: 6px;
    color: var(--accent);
    opacity: 0.6;
  }

  /* ── MAIN CONTENT ── */
  main {
    padding-top: calc(var(--header-h) + 16px);
    padding-bottom: 60px;
    max-width: 680px;
    margin: 0 auto;
    padding-left: 16px;
    padding-right: 16px;
  }

  /* Chapter block */
  .chapter {
    margin-bottom: 32px;
  }

  .chapter-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent);
  }
  .chapter-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-light);
    border: 1px solid rgba(181,69,27,0.25);
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: 0.06em;
    flex-shrink: 0;
    margin-top: 3px;
  }
  .chapter-title {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
  }

  /* Section block */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .section-toggle {
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    text-align: left;
    transition: background 0.15s;
    gap: 10px;
  }
  .section-toggle:hover { background: var(--surface2); }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .section-arrow {
    font-size: 14px;
    color: var(--text3);
    transition: transform 0.22s ease;
    flex-shrink: 0;
  }
  .section.open .section-arrow { transform: rotate(180deg); }
  .section.open .section-toggle { background: var(--accent-light); }
  .section.open .section-label { color: var(--accent2); }

  .section-body {
    display: none;
    padding: 4px 14px 14px;
    border-top: 1px solid var(--border);
  }
  .section.open .section-body { display: block; }

  /* Bullet list */
  .bullets {
    list-style: none;
    padding: 0;
  }
  .bullets li {
    position: relative;
    padding: 5px 0 5px 16px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .bullets li:last-child { border-bottom: none; }
  .bullets li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 13px;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.7;
  }

  /* Sub-bullets */
  .bullets .sub {
    padding-left: 28px;
    font-size: 13px;
    color: var(--text2);
  }
  .bullets .sub::before {
    left: 14px;
    width: 4px; height: 4px;
    background: var(--text3);
    opacity: 1;
  }

  /* Key rule highlight */
  .key-rule {
    background: var(--green-light);
    border-left: 3px solid var(--green);
    border-radius: 4px;
    padding: 8px 12px;
    margin: 8px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--green);
    line-height: 1.45;
  }

  /* Warning rule */
  .warn-rule {
    background: var(--accent-light);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 8px 12px;
    margin: 8px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent2);
    line-height: 1.45;
  }

  /* Scroll target offset */
  .scroll-target {
    scroll-margin-top: calc(var(--header-h) + 12px);
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 20px 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.05em;
    border-top: 1px solid var(--border);
    max-width: 680px;
    margin: 0 auto;
  }
</style>
</head>

// Build drawer nav
function buildDrawer() {
  const nav = document.getElementById('drawerNav');
  nav.innerHTML = DATA.map(ch => `
    <div class="nav-chapter" id="nav-${ch.id}">
      <button class="nav-chapter-btn" onclick="toggleNavChapter('${ch.id}', event)">
        <span class="nav-ch-num">${ch.num}</span>
        <span class="nav-ch-title">${ch.title}</span>
        <span class="nav-ch-arrow">›</span>
      </button>
      <div class="nav-sections" id="navsec-${ch.id}">
        ${ch.sections.map(s => `
          <a class="nav-section-link" href="#${s.id}" onclick="navClick(event, '${s.id}')">${s.label}</a>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleNavChapter(id, e) {
  const btn = e.currentTarget;
  const sec = document.getElementById('navsec-' + id);
  const isOpen = sec.classList.contains('open');
  // close all
  document.querySelectorAll('.nav-sections.open').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.nav-chapter-btn.expanded').forEach(el => el.classList.remove('expanded'));
  if (!isOpen) {
    sec.classList.add('open');
    btn.classList.add('expanded');
  }
}

function navClick(e, sectionId) {
  e.preventDefault();
  closeDrawer();
  setTimeout(() => {
    const el = document.getElementById(sectionId);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth' });
      // auto-open the section
      const section = el.closest('.section');
      if (section && !section.classList.contains('open')) {
        section.classList.add('open');
      }
    }
  }, 320);
}

// Build main content
function buildMain() {
  const main = document.getElementById('main');
  main.innerHTML = DATA.map(ch => `
    <article class="chapter" id="${ch.id}">
      <div class="chapter-header">
        <span class="chapter-num">${ch.num}</span>
        <h2 class="chapter-title">${ch.title}</h2>
      </div>
      ${ch.sections.map(s => buildSection(s)).join('')}
    </article>
  `).join('');
}

function buildSection(s) {
  const items = s.content.map(c => {
    if (c.type === 'bullet') return `<li class="bullet-item">${c.text}</li>`;
    if (c.type === 'key') return `<li class="key-rule-item"><div class="key-rule">${c.text}</div></li>`;
    if (c.type === 'warn') return `<li class="warn-item"><div class="warn-rule">${c.text}</div></li>`;
    return '';
  }).join('');

  return `
    <div class="section scroll-target" id="${s.id}">
      <button class="section-toggle" onclick="toggleSection(this)">
        <span class="section-label">${s.label}</span>
        <span class="section-arrow">▾</span>
      </button>
      <div class="section-body">
        <ul class="bullets">
          ${items}
        </ul>
      </div>
    </div>
  `;
}

// Fix bullet rendering
document.addEventListener('DOMContentLoaded', () => {
  buildDrawer();
  buildMain();

  // Fix: key-rule and warn-rule items shouldn't have bullet styling
  document.querySelectorAll('.key-rule-item, .warn-item').forEach(li => {
    li.style.paddingLeft = '0';
  });
  document.querySelectorAll('.key-rule-item::before, .warn-item::before').forEach(pseudo => {
    pseudo.style.display = 'none';
  });
});

function toggleSection(btn) {
  const section = btn.closest('.section');
  section.classList.toggle('open');
}

function toggleExpandAll() {
  const btn = document.getElementById('expandAllBtn');
  const allSections = document.querySelectorAll('.section');
  const allExpanded = [...allSections].every(s => s.classList.contains('open'));

  if (allExpanded) {
    allSections.forEach(s => s.classList.remove('open'));
    btn.textContent = 'EXPAND ALL';
    btn.classList.remove('all-expanded');
  } else {
    allSections.forEach(s => s.classList.add('open'));
    btn.textContent = 'COLLAPSE ALL';
    btn.classList.add('all-expanded');
  }
}

// Hamburger / drawer
const hamburger = document.getElementById('hamburger');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');

hamburger.addEventListener('click', () => {
  const isOpen = drawer.classList.contains('open');
  isOpen ? closeDrawer() : openDrawer();
});
overlay.addEventListener('click', closeDrawer);

function openDrawer() {
  drawer.classList.add('open');
  overlay.classList.add('active');
  hamburger.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  drawer.classList.remove('open');
  overlay.classList.remove('active');
  hamburger.classList.remove('open');
  document.body.style.overflow = '';
}
